[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jgd"
version = "0.1.0"
description = "JavaGadgetDigger — autonomous Java deserialization gadget-chain mining"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
jgd = "jgd.cli:main"
jgd-tui = "jgd.tui:main"

[tool.setuptools]
packages = ["jgd", "jgd.mining", "jgd.verification", "jgd.poc", "jgd.infra"]
